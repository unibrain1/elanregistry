name: ✨ Feature Request
description: Suggest a new feature or enhancement for the Elan Registry
title: "[Feature]: "
labels: ["enhancement", "status: needs-planning"]
assignees: []
body:
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe this feature from a user's perspective
      placeholder: "As a [type of user], I want [some goal] so that [some reason]"
    validations:
      required: true

  - type: textarea
    id: problem-solution
    attributes:
      label: Problem & Solution
      description: What problem does this solve and how?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What needs to be implemented for this to be complete?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component Area
      options:
        - Database/Backend
        - User Interface/Frontend
        - Admin Interface
        - Maps/Images
        - Performance/Security
        - Documentation/Testing
        - Other
    validations:
      required: true

  - type: dropdown
    id: signal
    attributes:
      label: Signal
      description: |
        Where did this come from? See docs/development/ISSUE_WORKFLOW.md.
        Only pick "Owner" or "Analytics" if you have a real message or
        measurement to point at — never infer them.
      options:
        - "Owner — a named owner asked, by email, contact form, or club conversation"
        - "Analytics — logs or usage data show a gap"
        - "Operator — your own friction as admin/editor/owner of the site"
        - "Defect — broken against its own stated behaviour"
        - "Forced — security advisory, dependency EOL, platform change"
        - "Discovered — found while working another issue"
        - "None — nobody asked, I thought of it"
    validations:
      required: true

  - type: input
    id: beneficiary
    attributes:
      label: Beneficiary
      description: One sentence — who is better off, specifically, if this ships?
      placeholder: "Owners with no photos on their car cannot..."
    validations:
      required: true

  - type: textarea
    id: verbatim-quote
    attributes:
      label: Verbatim Quote (if there is one)
      description: Paste the requester's actual words, if there is a signal:owner request behind this. Leave blank otherwise.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Technical requirements, alternatives, screenshots, mockups, etc.