name: 🐛 Bug Report
description: Report a bug to help us improve the Elan Registry
title: "[Bug]: "
labels: ["bug", "status: needs-planning"]
assignees: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you were doing when it occurred
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL (if applicable)
      placeholder: https://elanregistry.org/...

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device type
      placeholder: "Chrome on macOS Desktop"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Additional Context
      description: Add screenshots or additional details if helpful

  - type: dropdown
    id: signal
    attributes:
      label: Signal
      description: |
        Where did this come from? See docs/development/ISSUE_WORKFLOW.md.
        Only pick "Owner" or "Analytics" if you have a real message or
        measurement to point at — never infer them.
      options:
        - "Owner — a named owner asked, by email, contact form, or club conversation"
        - "Analytics — logs or usage data show a gap"
        - "Operator — your own friction as admin/editor/owner of the site"
        - "Defect — broken against its own stated behaviour"
        - "Forced — security advisory, dependency EOL, platform change"
        - "Discovered — found while working another issue"
        - "None — nobody asked, I noticed it myself"
    validations:
      required: true

  - type: input
    id: beneficiary
    attributes:
      label: Beneficiary
      description: One sentence — who is worse off today because this bug exists?
      placeholder: "Owners with no photos on their car cannot..."
    validations:
      required: true

  - type: textarea
    id: verbatim-quote
    attributes:
      label: Verbatim Quote (if there is one)
      description: Paste the reporter's actual words, if this came from someone else. Leave blank otherwise.